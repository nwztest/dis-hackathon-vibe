[platformio]
default_envs = esp32s3_cam_common

[env:esp32s3_cam_common]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM3
monitor_port = COM3
upload_flags =
  --no-stub
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
lib_deps =
  bblanchon/ArduinoJson@7.3.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DCARE_GUARD_FIRMWARE_VERSION=\"0.1.6\"
  -DCARE_GUARD_CAMERA_PROFILE=\"esp32s3_cam_common\"
